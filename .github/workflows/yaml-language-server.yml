# YAML Language Server Update
name: Package yaml-language-server

on:
  workflow_dispatch:
    inputs:
      yaml-language-server_version:
        type: string
        required: true
        default: "2.0.0"

jobs:
  package_all:
    name: Package YAML Language Server
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      VERSION: ${{ inputs.yaml-language-server_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Get yaml-language-server
        run: |
          npm pack "yaml-language-server@${VERSION}"
          tar -xzf "yaml-language-server-${VERSION}.tgz"
      - name: Install Runtime Dependencies
        run: |
          cd package
          lockfile="$GITHUB_WORKSPACE/package-locks/yaml-language-server-${VERSION}.json"
          if [ -f "$lockfile" ]; then
            cp "$lockfile" package-lock.json
            npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          else
            npm install --omit=dev --ignore-scripts --no-audit --no-fund
          fi
      - name: Package
        run: |
          mkdir bundle
          cp -r package/{LICENSE,package.json,bin,out,l10n,node_modules} bundle
          mv bundle yaml-language-server
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -zcf yaml-language-server-${VERSION}.tar.gz yaml-language-server
      - name: Create Release
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete -y "yaml-language-server-$VERSION" || true
          gh release create -t "yaml-language-server-$VERSION" "yaml-language-server-$VERSION" "yaml-language-server-${VERSION}.tar.gz"
