# VSCode Language Servers Update
name: Package vscode-languageservers

on:
  workflow_call:
    inputs:
      vscode_version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      vscode_version:
        type: string
        required: true
        default: "1.144.0"

jobs:
  package_all:
    name: Package VSCode Language Servers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.vscode_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Get vscode
        run: |
          curl -fL -o "v${VERSION}.tar.gz" "https://github.com/microsoft/vscode/archive/refs/tags/${VERSION}.tar.gz"
      - name: Build vscode-languageservers
        run: |
          tar -xzvf "v${VERSION}.tar.gz"
          git apply --directory=vscode-${VERSION} patches/vscode-json-languageserver/*.patch --verbose
          for server in json html css; do
            pushd "vscode-${VERSION}/extensions/${server}-language-features/server"
            lockfile="$GITHUB_WORKSPACE/package-locks/vscode-${server}-languageserver-${VERSION}.json"
            if [ -f "$lockfile" ]; then cp "$lockfile" package-lock.json; fi
            npm i @vercel/ncc@0.38.4 typescript@5.9.3
            if [ "$server" = json ]; then
              npx ncc build src/node/jsonServerNodeMain.ts --transpile-only --license LICENSES --external request-light
            elif [ "$server" = html ]; then
              npx ncc build src/node/htmlServerNodeMain.ts --transpile-only --license LICENSES --external typescript
            else
              npx ncc build src/node/cssServerNodeMain.ts --transpile-only --license LICENSES
            fi
            # ncc writes machine-specific bytecode caches inside its package.
            # Only runtime dependencies belong in the distributed archives.
            if [ "$server" = json ]; then
              npm uninstall --ignore-scripts --no-audit --no-fund @vercel/ncc typescript
            else
              npm uninstall --ignore-scripts --no-audit --no-fund @vercel/ncc
            fi
            popd
          done
      - name: Package
        run: |
          mkdir vscode-json-languageserver vscode-html-languageserver vscode-css-languageserver
          cp -r vscode-${VERSION}/LICENSE.txt vscode-${VERSION}/extensions/json-language-features/server/dist vscode-json-languageserver
          cp -r vscode-${VERSION}/LICENSE.txt vscode-${VERSION}/extensions/html-language-features/server/dist vscode-html-languageserver
          cp -r vscode-${VERSION}/LICENSE.txt vscode-${VERSION}/extensions/css-language-features/server/dist vscode-css-languageserver
          cp -r vscode-${VERSION}/extensions/json-language-features/server/node_modules vscode-json-languageserver
          cp -r vscode-${VERSION}/extensions/html-language-features/server/node_modules vscode-html-languageserver
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -zcf vscode-json-languageserver-${VERSION}.tar.gz vscode-json-languageserver
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -zcf vscode-html-languageserver-${VERSION}.tar.gz vscode-html-languageserver
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -zcf vscode-css-languageserver-${VERSION}.tar.gz vscode-css-languageserver
      - name: Create Release
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete -y "vscode-languageservers-${VERSION}" || true
          gh release create --target "${{ github.sha }}" -t "vscode-languageservers-${VERSION}" "vscode-languageservers-${VERSION}" \
            "vscode-json-languageserver-${VERSION}.tar.gz" \
            "vscode-html-languageserver-${VERSION}.tar.gz" \
            "vscode-css-languageserver-${VERSION}.tar.gz"
