# Emmet Language Server Update
name: Package emmet-language-server

on:
  workflow_dispatch:
    inputs:
      emmet-language-server_version:
        type: string
        required: true
        default: "2.8.0"

jobs:
  package_all:
    name: Package Emmet Language Server
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      VERSION: ${{ inputs.emmet-language-server_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Get emmet-language-server
        run: |
          curl -fL -o "v${VERSION}.tar.gz" "https://github.com/olrtg/emmet-language-server/archive/refs/tags/v${VERSION}.tar.gz"
      - name: Build emmet-language-server
        run: |
          tar -xzvf "v${VERSION}.tar.gz"
          cd "emmet-language-server-${VERSION}"
          lockfile="$GITHUB_WORKSPACE/package-locks/emmet-language-server-${VERSION}.json"
          if [ -f "$lockfile" ]; then cp "$lockfile" package-lock.json; fi
          npm i @vercel/ncc@0.38.4
          node node_modules/@vercel/ncc/dist/ncc/cli.js build index.ts --license LICENSES
      - name: Package
        run: |
          mkdir bundle
          cp -r emmet-language-server-${VERSION}/{LICENSE,dist} bundle
          mv bundle emmet-language-server
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -zcf emmet-language-server-${VERSION}.tar.gz emmet-language-server
      - name: Create Release
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete -y "emmet-language-server-$VERSION" || true
          gh release create -t "emmet-language-server-$VERSION" "emmet-language-server-$VERSION" "emmet-language-server-${VERSION}.tar.gz"
