# Zig Language Server Update
name: Re-package zls

on:
  workflow_dispatch:
    inputs:
      zls_version:
        type: string
        required: true
        default: "0.17.0"

jobs:
  package_all:
    name: Package zls
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      VERSION: ${{ inputs.zls_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Update Packages
        run: sudo apt-get update -y
      - name: Install Dependencies
        run: sudo apt-get install -y xz-utils
      - name: Get zls
        run: |
          for arch in aarch64-linux aarch64-macos x86-linux x86_64-linux x86_64-macos; do
            curl -fL -o "zls-${arch}.tar.xz" "https://github.com/zigtools/zls/releases/download/${VERSION}/zls-${arch}.tar.xz"
          done
      - name: Repack zls
        run: |
          for archive in *.tar.xz; do
            directory="${archive%.tar.xz}"
            mkdir "$directory"
            tar -xJf "$archive" -C "$directory"
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -zcf "${directory}.tar.gz" -C "$directory" .
          done
      - name: Create Release
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete -y "zls-$VERSION" || true
          gh release create -t "zls-$VERSION" "zls-$VERSION" zls-*.tar.gz
