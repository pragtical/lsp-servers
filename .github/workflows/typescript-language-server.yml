# TypeScript Language Server Update
name: Package typescript-language-server

on:
  workflow_dispatch:
    inputs:
      typescript-language-server_version:
        type: string
        required: true
        default: "6.0.2"
      tsserver_version:
        description: "Compatible TypeScript tsserver package (TypeScript 6.x)"
        type: string
        required: false
        default: "6.0.3"

jobs:
  package_all:
    name: Package Typescript Language Server
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      VERSION: ${{ inputs.typescript-language-server_version }}
      TS_VERSION: ${{ inputs.tsserver_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Get typescript-language-server
        run: |
          npm pack "typescript-language-server@${VERSION}"
          mkdir server
          tar -xzf "typescript-language-server-${VERSION}.tgz" --strip-components=1 -C server
      - name: Get Typescript
        run: |
          npm pack "typescript@${TS_VERSION}"
          mkdir typescript
          tar -xzf "typescript-${TS_VERSION}.tgz" --strip-components=1 -C typescript
      - name: Package
        run: |
          mkdir bundle
          cp -r server/{package.json,lib,LICENSE} bundle
          mkdir -p bundle/node_modules/typescript
          cp -r typescript/. bundle/node_modules/typescript
          mv bundle tsserver
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -zcf tsserver-${VERSION}.tar.gz tsserver
      - name: Create Release
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete -y "typescript-language-server-$VERSION" || true
          gh release create -t "typescript-language-server-$VERSION" "typescript-language-server-$VERSION" "tsserver-${VERSION}.tar.gz"
